# EvaReel IAP verify server + promo site + 视频静态分发 nginx config (香港服务器 43.129.30.172)
# Installed by deploy-on-server.sh to /etc/nginx/conf.d/evareel.conf
# certbot --nginx rewrites the proxy block to add 443 + cert paths.
# 实际线上配置以服务器上 certbot 改写后的 evareel.conf 为准(见 43.129.30.172)。
# 视频相关两段 location（/evareel/videos/、/evareel/catalog.json）已并入线上，详见块内注释。

# ── promo landing page: www.haoweimedia.cn / haoweimedia.cn ──
server {
    listen 80;
    server_name www.haoweimedia.cn haoweimedia.cn;
    root /var/www/haoweimedia;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ── IAP verify API: api.haoweimedia.cn ──
server {
    listen 80;
    server_name api.haoweimedia.cn;

    # ── EvaReel 视频静态分发（Range 拖动 + 长缓存）──
    # 文件放服务器 /var/www/evareel-videos/，结构: <dramaId>/<ep>.mp4
    # 状态：✅ 已并入线上 /etc/nginx/conf.d/evareel.conf（api.haoweimedia.cn server 块，位于 location / 之前）。
    # 部署：mkdir -p /var/www/evareel-videos && nginx -t && systemctl reload nginx
    #       若 nginx -V 无 http_mp4_module，删掉下面 mp4; 行（纯 Range 仍支持拖动）。
    location /evareel/videos/ {
        alias /var/www/evareel-videos/;
        mp4;                                 # 伪流式(需 http_mp4_module; 缺失可删此行, Range 仍支持拖动)
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=2592000, immutable";
        types { video/mp4 mp4; }
    }
    location = /evareel/catalog.json {
        alias /var/www/evareel-videos/catalog.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60";
        # 状态：✅ 已并入线上（同上）。更新 catalog.json 后无需 reload。
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
