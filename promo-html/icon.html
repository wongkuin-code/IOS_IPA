<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:1024px; }
  body { background:#101010; }
  .icon { width:1024px; height:1024px; position:relative; background:#101010; }
  svg { display:block; }
</style>
</head>
<body>
  <div class="icon">
    <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <!-- background -->
      <rect width="1024" height="1024" fill="#101010"/>
      <!-- subtle glow behind book -->
      <circle cx="512" cy="512" r="470" fill="url(#glow)"/>
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f0c060" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#f0c060" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f8d27a"/>
          <stop offset="45%" stop-color="#f0c060"/>
          <stop offset="100%" stop-color="#c9942f"/>
        </linearGradient>
      </defs>

      <!-- left page -->
      <path d="M512,268
               C436,286 330,302 228,322
               L228,742
               C330,722 436,706 512,688
               Z"
            fill="url(#book)"/>
      <!-- right page -->
      <path d="M512,268
               C588,286 694,302 796,322
               L796,742
               C694,722 588,706 512,688
               Z"
            fill="url(#book)"/>
      <!-- page opening shadow -->
      <path d="M512,268 C486,330 486,626 512,688 C538,626 538,330 512,268 Z"
            fill="#0d0a06" opacity="0.55"/>

      <!-- play button -->
      <circle cx="512" cy="478" r="120" fill="#1c1510" stroke="#f0c060" stroke-width="12"/>
      <path d="M478,418 L478,538 L582,478 Z" fill="#f0c060"/>

      <!-- book base / cover edge -->
      <path d="M228,742 L228,760 C330,742 436,724 512,706 C588,724 694,742 796,760 L796,742 C694,722 588,706 512,688 C436,706 330,722 228,742 Z"
            fill="#c9942f" opacity="0.9"/>
    </svg>
  </div>
</body>
</html>
