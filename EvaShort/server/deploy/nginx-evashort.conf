# EvaShort IAP verify server + promo site nginx config (香港服务器 43.129.30.172)
# Installed by deploy-on-server.sh to /etc/nginx/conf.d/evashort.conf
# certbot --nginx rewrites the proxy block to add 443 + cert paths.
# 实际线上配置以服务器上 certbot 改写后的 evashort.conf 为准(见 43.129.30.172)。

# ── promo landing page: www.haoweimedia.cn / haoweimedia.cn ──
server {
    listen 80;
    server_name www.haoweimedia.cn haoweimedia.cn;
    root /var/www/haoweimedia;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ── IAP verify API: api.haoweimedia.cn ──
server {
    listen 80;
    server_name api.haoweimedia.cn;

    # ── EvaShort 隐私政策静态分发 ──
    # 文件放 /var/www/evashort/ , 由 deploy-on-server.sh 从 server/privacy/ 同步。
    # 不能放 /opt/evashort-server —— rsync --delete 会删掉。
    # App 内链接: https://api.haoweimedia.cn/evashort/privacy-policy.html
    location /evashort/ {
        alias /var/www/evashort/;
        add_header Access-Control-Allow-Origin "*";
        # 改为 no-cache: 浏览器每次向服务器校验, 内容变了立即生效(避免审核/自查时看到旧缓存)
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
