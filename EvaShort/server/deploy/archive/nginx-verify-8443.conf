# ─────────────────────────────────────────────────────────────────────────────
# IAP verify API — transitional 8443 TLS block (bypass ICP-blocking on 80/443)
# Replace the original `listen 80; server_name verify.haoweimedia.com` block
# in /etc/nginx/conf.d/evareel.conf with this entire server{} block.
#
#   - Certificate paths are fixed at /etc/letsencrypt/live/verify.haoweimedia.com/
#     (issued via acme.sh DNS-01, see 8443-setup-guide.md).
#   - App side already points VERIFY_API to https://verify.haoweimedia.com:8443
#   - After ICP filing passes (or you buy a HK machine), just change
#     `listen 8443 ssl;` -> `listen 443 ssl;` and drop the :8443 in the App.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 8443 ssl;
    server_name verify.haoweimedia.com;

    ssl_certificate     /etc/letsencrypt/live/verify.haoweimedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verify.haoweimedia.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # iOS ATS: a valid CA-signed cert on a non-443 port is accepted as-is.
    # No NSAllowsArbitraryLoads needed.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
